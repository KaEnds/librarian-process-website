
services:
  librarianweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librarianweb
    environment:
      NODE_ENV: production
      PORT: 5000
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "5000"
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librarianweb.rule=Host(`librarian-process-web.library.work`)"
      - "traefik.http.services.librarianweb.loadbalancer.server.port=5000"
    restart: unless-stopped

  # ---------- Cloudflare Tunnel ----------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel-librarianweb
    depends_on:
      - librarianweb
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}