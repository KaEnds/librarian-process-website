networks:
  librairy-net:
    external: true

services:
  librarianweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librarianweb
    environment:
      NODE_ENV: production
      PORT: 5000
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "5000"
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librarianweb.rule=Host(`librarian-process-web.library.work`)"
      - "traefik.http.services.librarianweb.loadbalancer.server.port=5000"
    restart: unless-stopped
    networks:
      - librairy-net

  # ---------- Cloudflare Tunnel ----------
